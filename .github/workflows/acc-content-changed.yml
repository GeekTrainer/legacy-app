name: ACC content changed (dispatch receiver)

# Receives repository_dispatch from the ACC course repo when module content
# changes, and proposes an updated delta store as a PR (agent proposes; human +
# CI dispose). See course-build/REFS.md for the payload contract.
#
# Flow: validate payload -> checkout ACC@acc_sha -> invoke ACC module-runner for
# the affected module -> regenerate downstream range (N+1..07) into staging ->
# commit updated delta patches on a branch -> open PR. App-code cascade conflicts
# (M05/M06) are flagged for human resolution and never auto-resolved.

on:
  repository_dispatch:
    types: [acc-content-changed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One regen at a time per affected module to avoid racing staging refs.
  group: acc-regen-${{ github.event.client_payload.affected_module }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      ACC_SHA: ${{ github.event.client_payload.acc_sha }}
      ACC_REF: ${{ github.event.client_payload.acc_ref }}
      AFFECTED_MODULE: ${{ github.event.client_payload.affected_module }}
      ACC_VERSION: ${{ github.event.client_payload.acc_version }}
      REASON: ${{ github.event.client_payload.reason }}
      DISPATCH_ID: ${{ github.event.client_payload.dispatch_id }}
      # Integration points — see course-build/OPERATIONS.md for provisioning.
      #   ACC_REPO              ACC course repo (default below if var unset).
      #   ACC_MODULE_RUNNER_CMD invocation template for ACC's module-runner skill.
      #       module-runner is a Copilot skill (prompt-invoked via Copilot CLI),
      #       not a standalone script. It takes named inputs module/base-ref/
      #       acc-ref/repo/out, writes result.json, and exits 0=PASS 1=FAIL
      #       2=usage 3=BLOCKED (ACC PR #18). Supported placeholders:
      #       {module} {base-ref} {acc-ref} {repo} {target} {out}
      ACC_REPO: ${{ vars.ACC_REPO || 'GeekTrainer/advanced-copilot-cli' }}
      # module-runner is a Copilot skill invoked via Copilot CLI in seed mode.
      # base-ref is computed here (zero-padded start-of-module-NN) and injected as
      # {base-ref}; acc-ref is the pinned 40-char acc_sha ({acc_ref}). Ops may
      # override via the ACC_MODULE_RUNNER_CMD repo variable (e.g. to pin --model);
      # when unset the step uses a pinned default seed invocation.
      ACC_MODULE_RUNNER_CMD: ${{ vars.ACC_MODULE_RUNNER_CMD }}
    steps:
      - name: Validate payload
        run: |
          set -euo pipefail
          echo "acc_sha=$ACC_SHA affected_module=$AFFECTED_MODULE reason=$REASON dispatch_id=$DISPATCH_ID"
          case "$ACC_SHA" in
            *[!0-9a-fA-F]* | "" ) echo "::error::acc_sha must be a hex SHA"; exit 1;;
          esac
          if ! [ "$AFFECTED_MODULE" -ge 1 ] 2>/dev/null || [ "$AFFECTED_MODULE" -gt 7 ]; then
            echo "::error::affected_module must be an integer 1..7"; exit 1
          fi

      - name: Normalize inputs
        id: norm
        run: |
          set -euo pipefail
          DID="${DISPATCH_ID:-$(date -u +%Y%m%d)-${{ github.run_id }}}"
          VER="${ACC_VERSION:-$(date -u +%Y-%m)}"
          FROM=$(( AFFECTED_MODULE + 1 ))   # downstream range start (module numbers)
          echo "dispatch_id=$DID" >> "$GITHUB_OUTPUT"
          echo "acc_version=$VER" >> "$GITHUB_OUTPUT"
          echo "from_module=$FROM" >> "$GITHUB_OUTPUT"
          echo "branch=regen/${DID}/proposal" >> "$GITHUB_OUTPUT"

      - name: Checkout legacy-app
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: legacy-app

      - name: Checkout ACC @ acc_sha
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ACC_REPO }}
          ref: ${{ env.ACC_SHA }}
          path: acc
          fetch-depth: 0
          # ACC may be private; provide a token via repo secret if so.
          token: ${{ secrets.ACC_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure base commit present
        working-directory: legacy-app
        run: git fetch --no-tags origin "$(node -e "console.log(require('./course-build/manifest.json').base.sha)")" || true

      - name: Configure git identity
        working-directory: legacy-app
        run: |
          git config user.name "acc-course-bot"
          git config user.email "acc-course-bot@users.noreply.github.com"
          git checkout -b "${{ steps.norm.outputs.branch }}"

      - name: Invoke ACC module-runner to propose updated delta
        id: runner
        working-directory: legacy-app
        run: |
          set -uo pipefail
          RUNNER_CMD="${ACC_MODULE_RUNNER_CMD:-}"
          if [ -z "$RUNNER_CMD" ]; then
            # Pinned default seed invocation (module-runner is a Copilot skill).
            RUNNER_CMD='copilot -p "Run module-runner in validator/seed mode with: mode=seed module={module} base-ref={base-ref} acc-ref={acc_ref} repo={target} out={out}" --allow-all --log-level error'
          fi
          OUT="$(mktemp -d)"
          TARGET="$PWD"
          # start-of-module-NN (zero-padded) is the starting state seeded from.
          BASE_REF="$(printf 'start-of-module-%02d' "$AFFECTED_MODULE")"
          CMD="$RUNNER_CMD"
          CMD="${CMD//\{module\}/$AFFECTED_MODULE}"
          CMD="${CMD//\{base-ref\}/$BASE_REF}"
          CMD="${CMD//\{base_ref\}/$BASE_REF}"
          CMD="${CMD//\{acc-ref\}/$ACC_SHA}"
          CMD="${CMD//\{acc_ref\}/$ACC_SHA}"
          CMD="${CMD//\{repo\}/$ACC_REPO}"
          CMD="${CMD//\{target\}/$TARGET}"
          CMD="${CMD//\{out\}/$OUT}"
          echo "Running (in ../acc): $CMD"
          # The skill runs inside a Copilot session; its process exit is NOT
          # authoritative — result.json is. Don't fail the step on copilot's rc.
          ( cd "$GITHUB_WORKSPACE/acc" && bash -c "$CMD" ) || echo "copilot process exit: $?"

          # Authoritative outcome: parse result.json ($OUT/result.json).
          if [ ! -f "$OUT/result.json" ]; then
            echo "::error::module-runner emitted no result.json — treating as unparseable (mapped exit 3)."
            echo "status=MISSING" >> "$GITHUB_OUTPUT"
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 3
          fi
          echo "result.json:"; cat "$OUT/result.json"; echo
          RESULT="$(node -e "try{const r=require('$OUT/result.json');process.stdout.write(String(r.result||''))}catch(e){process.stdout.write('__PARSE_ERROR__')}")"
          if [ "$RESULT" = "__PARSE_ERROR__" ] || [ -z "$RESULT" ]; then
            echo "::error::result.json present but unparseable / missing .result (mapped exit 3)."
            echo "status=MISSING" >> "$GITHUB_OUTPUT"
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 3
          fi
          echo "module-runner result: $RESULT"

          # result.result → behavior (PASS=0, FAIL=1, BLOCKED=2, missing/unparseable=3).
          case "$RESULT" in
            PASS) echo "status=PASS" >> "$GITHUB_OUTPUT" ;;
            FAIL)
              echo "::warning::module-runner reported FAIL — a verification step failed. No patches staged; PR still opened from stored deltas."
              echo "status=FAIL" >> "$GITHUB_OUTPUT"; echo "ran=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            BLOCKED)
              echo "::warning::module-runner reported BLOCKED — prereq/credential/external-service prevented a valid run. Flagging for human input."
              echo "status=BLOCKED" >> "$GITHUB_OUTPUT"; echo "ran=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *)
              echo "::error::Unknown result '$RESULT' in result.json (mapped exit 3)."
              echo "status=MISSING" >> "$GITHUB_OUTPUT"; echo "ran=false" >> "$GITHUB_OUTPUT"; exit 3 ;;
          esac

          # PASS: stage the produced patch series (seed mode writes $OUT/patches/).
          MOD=$(printf 'module-%02d' "$AFFECTED_MODULE")
          if compgen -G "$OUT/patches/*.patch" > /dev/null; then
            rm -f "course-build/deltas/$MOD/"*.patch || true
            cp "$OUT"/patches/*.patch "course-build/deltas/$MOD/"
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::result PASS but no patches in $OUT/patches (validate mode?). Nothing staged."
            echo "ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate downstream range into staging
        id: regen
        working-directory: legacy-app
        continue-on-error: true
        run: |
          set -euo pipefail
          node course-build/scripts/build-branches.mjs \
            --dispatch-id "${{ steps.norm.outputs.dispatch_id }}" \
            --from "${{ steps.norm.outputs.from_module }}"

      - name: Detect app-code cascade conflicts
        id: conflicts
        working-directory: legacy-app
        run: |
          set -euo pipefail
          RUNNER_STATUS="${{ steps.runner.outputs.status }}"
          if [ "${{ steps.regen.outcome }}" != "success" ]; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "reason=cascade" >> "$GITHUB_OUTPUT"
            echo "::warning::Regeneration failed to apply cleanly — likely an app-code cascade conflict downstream of module $AFFECTED_MODULE. Flagging for human resolution."
          elif [ "$RUNNER_STATUS" = "BLOCKED" ]; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "reason=blocked" >> "$GITHUB_OUTPUT"
            echo "::warning::module-runner reported BLOCKED — flagging for human input."
          else
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "reason=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated delta store
        id: commit
        working-directory: legacy-app
        run: |
          set -euo pipefail
          git add course-build/deltas
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No delta changes produced."
          else
            git commit -m "regen: update delta store for ACC module ${AFFECTED_MODULE} @ ${ACC_SHA}" \
              -m "acc_ref: ${ACC_REF}" -m "dispatch_id: ${{ steps.norm.outputs.dispatch_id }}"
            git push origin "HEAD:${{ steps.norm.outputs.branch }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open / update PR
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: legacy-app
        run: |
          set -euo pipefail
          CONFLICT="${{ steps.conflicts.outputs.conflict }}"
          CREASON="${{ steps.conflicts.outputs.reason }}"
          RSTATUS="${{ steps.runner.outputs.status }}"
          TITLE="regen: ACC module ${AFFECTED_MODULE} delta update (${{ steps.norm.outputs.acc_version }})"
          LABELS="acc-regen"
          BODY_FILE="$(mktemp)"
          {
            echo "Automated delta-store regeneration triggered by an ACC content change."
            echo
            echo "| field | value |"
            echo "| ----- | ----- |"
            echo "| affected module | ${AFFECTED_MODULE} |"
            echo "| downstream range | start-of-module-${{ steps.norm.outputs.from_module }} .. start-of-module-07 |"
            echo "| acc_sha | \`${ACC_SHA}\` |"
            echo "| acc_ref | ${ACC_REF} |"
            echo "| acc_version | ${{ steps.norm.outputs.acc_version }} |"
            echo "| reason | ${REASON} |"
            echo "| module-runner result | ${RSTATUS} |"
            echo
            if [ "$CONFLICT" = "true" ] && [ "$CREASON" = "blocked" ]; then
              echo "> [!CAUTION]"
              echo "> **Manual input required.** module-runner returned \`BLOCKED\` — a prerequisite, credential, or external service prevented a valid seed run for module ${AFFECTED_MODULE}. See the run log / \`result.json\`. No delta was auto-proposed; a human must unblock and re-run."
            elif [ "$CONFLICT" = "true" ]; then
              echo "> [!CAUTION]"
              echo "> **Manual resolution required.** Regeneration hit a cascade conflict applying the stored downstream deltas on top of the updated module ${AFFECTED_MODULE} (app-code modules M05/M06 carry real code). The affected downstream delta(s) must be re-authored by a human before this can validate. App-code conflicts are never auto-resolved."
            else
              echo "> [!NOTE]"
              echo "> Downstream chain regenerated and applied cleanly. Validation CI must still pass before promotion."
            fi
            echo
            echo "On merge, \`promote-branches.yml\` will atomically move the \`start-of-module-N\` aliases and cut \`acc-${{ steps.norm.outputs.acc_version }}/start-of-module-N\` tags."
          } > "$BODY_FILE"

          if [ "$CONFLICT" = "true" ] && [ "$CREASON" = "blocked" ]; then LABELS="$LABELS,needs-human-resolution,runner-blocked";
          elif [ "$CONFLICT" = "true" ]; then LABELS="$LABELS,needs-human-resolution,app-code-conflict"; fi

          # Ensure labels exist (ignore errors if they already do).
          for l in $(echo "$LABELS" | tr ',' ' '); do gh label create "$l" -c "#B60205" -f >/dev/null 2>&1 || true; done

          EXISTING=$(gh pr list --head "${{ steps.norm.outputs.branch }}" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE" --add-label "$LABELS"
          else
            gh pr create --title "$TITLE" --body-file "$BODY_FILE" \
              --base main --head "${{ steps.norm.outputs.branch }}" --label "$LABELS"
          fi

      - name: Fail the run if manual resolution is required
        if: steps.conflicts.outputs.conflict == 'true'
        run: |
          echo "::error::Cascade conflict downstream of module ${AFFECTED_MODULE}; PR opened and flagged for human resolution."
          exit 1
